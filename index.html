<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>ПАРОЛИ</title>
<style>
@font-face{font-family:"Game Mono";src:url(fonts/JetBrainsMono-Regular.woff2) format("woff2");font-weight:400;font-display:block}
@font-face{font-family:"Game Mono";src:url(fonts/JetBrainsMono-Bold.woff2) format("woff2");font-weight:700;font-display:block}
:root{--bg:#0b0f0c;--fg:#8cff7a;--dim:#3f7a39;--faint:#2f5a35;--amber:#ffc24a;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--fg);font-family:"Game Mono",Menlo,monospace;overflow:hidden;cursor:none;text-shadow:0 0 6px rgba(140,255,122,.6)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.10) 0 2px,transparent 2px 4px)}
.crt{height:100%;overflow:hidden;display:grid;grid-template-rows:auto auto 1fr auto;background:radial-gradient(ellipse at center,#111a13 0%,var(--bg) 70%,#000 100%);padding:18px 40px 14px;gap:0;text-shadow:0 0 6px rgba(140,255,122,.6)}
.bar{display:flex;justify-content:space-between;font-size:22px;color:var(--dim);border-bottom:1px solid var(--faint);padding-bottom:6px}
.bar b{color:var(--fg)}
/* Полоска секторов: по ячейке на уровень, пройденные жёлтые, текущий зелёный. Весь путь игры одним взглядом. */
.bar .sectors{margin-left:1.5em;letter-spacing:.15em}
.bar .sectors .done{color:var(--amber)}
.bar .sectors .now{color:var(--fg);animation:sector 1.2s ease-in-out infinite}
@keyframes sector{50%{opacity:.3}}
.bar .access{color:var(--amber);font-size:44px}
.bar .access b{color:var(--fg);display:inline-block}
.bar .access b.pulse{animation:pulse .3s ease-out}
@keyframes pulse{50%{transform:scale(1.3)}}
.entry{padding:90px 0 24px;min-height:330px}
.input{font-size:170px;line-height:1.1;letter-spacing:.06em;white-space:pre}
.input .slot{position:relative;display:inline-block}
.hint{position:absolute;bottom:100%;padding-bottom:.08em;left:0;width:100%;text-align:center;font-size:.5em;color:#5fa856;opacity:0;line-height:1}
.hint.on{opacity:.85}
#typed.full{color:#d9ffd0;text-shadow:0 0 18px rgba(140,255,122,.9)}
#typed.won{color:var(--amber);text-shadow:0 0 24px rgba(255,194,74,.8)}
body.final .cur{display:none}
.input .p{color:var(--amber)}
.cur{display:inline-block;width:.6em;height:1em;background:var(--fg);vertical-align:-0.12em;animation:b 1s steps(2) infinite;margin-left:6px}
.cur.shake{animation:sh .18s linear}
@keyframes b{50%{opacity:0}}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-.18em)}75%{transform:translateX(.18em)}}
/* Строка под вводом: эквалайзер под голос (js/main.js, AnalyserNode), а на полном слове — «Enter ⏎» жёлтым.
   Надписей «слушай…/печатай» нет: голубой не вписывался, а что делать, и так ясно. */
.speak{font-size:34px;color:var(--dim);padding-top:18px;height:60px}
.speak .ico{display:inline-block;width:1em;height:1em;margin-right:.45em;vertical-align:-.1em;color:var(--fg);opacity:.5;filter:drop-shadow(0 0 6px rgba(140,255,122,.6))}
.speak.on .ico{opacity:1}
.speak .wave{display:inline-block;letter-spacing:2px;color:var(--fg);opacity:.5}
.speak.on .wave{opacity:1}
.speak.enter .wave,.speak.enter .ico{display:none}
.speak #speakText{color:var(--amber);text-shadow:0 0 12px rgba(255,194,74,.6)}
/* Окно сценки: раскрывается из точки в полосу и в окно, как включение ЭЛТ; закрывается обратно. */
.win{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6)}
.win.on{display:flex}
.winbox{width:70vw;height:55vh;border:3px solid var(--fg);background:#060906;box-shadow:0 0 40px rgba(140,255,122,.35),inset 0 0 60px rgba(0,0,0,.6);display:flex;flex-direction:column;overflow:hidden}
.win.opening .winbox{animation:wopen .28s linear forwards}
.win.closing .winbox{animation:wclose .18s linear forwards}
/* Конец уровня: окно почти во весь экран, вспышка и тряска, когда ворота взрываются. */
.win.full .winbox{width:96vw;height:90vh}
.win.flash{animation:flash .4s linear forwards}
@keyframes flash{0%{background:rgba(255,230,160,.85)}100%{background:rgba(0,0,0,.6)}}
.winbox.shake{animation:shake .5s linear}
@keyframes shake{10%,90%{transform:translate(-8px,3px)}20%,80%{transform:translate(10px,-5px)}30%,50%,70%{transform:translate(-14px,8px)}40%,60%{transform:translate(14px,-8px)}}
.winbox>*{visibility:hidden}
.win.ready .winbox>*{visibility:visible}
@keyframes wopen{0%{transform:scale(0,.015)}45%{transform:scale(1,.015)}100%{transform:scale(1,1)}}
@keyframes wclose{0%{transform:scale(1,1)}55%{transform:scale(1,.015)}100%{transform:scale(0,.015)}}
.wintitle{font-size:26px;color:var(--dim);border-bottom:1px solid var(--faint);padding:8px 20px;letter-spacing:.1em}
.wintitle b{color:var(--amber)}
/* Размеры сценок от экрана: окно 70vw × 55vh, 6 строк по 36–40 знаков должны влезть. */
#fx{margin:auto;font-size:min(5.2vh,2.9vw);line-height:1.15;color:var(--fg);white-space:pre;max-width:100%}
#fx.center{text-align:center}
#fx.big{font-size:min(6.6vh,3.7vw);line-height:1.08}
#fx.huge{font-size:min(14vh,7.8vw);line-height:1.1}
#fx .lit{color:var(--amber);text-shadow:0 0 12px rgba(255,194,74,.6)}
#fx .bg{color:var(--dim);opacity:var(--bg-dim,1)}
/* Черты по высоте заглавных: символ | в шрифте выше букв и уходит под строку. */
#fx .bars{display:inline-block;line-height:.9;padding:0 .3em;border-left:.09em solid currentColor;border-right:.09em solid currentColor}
body.accepting .cur{visibility:hidden}
.low{display:flex;align-items:flex-end;overflow:hidden;min-height:0}
.log{flex:1;max-height:340px;font-size:36px;line-height:1.5;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:14px;min-width:0}
/* Справа внизу: осциллограф (js/scope.js, с 10 уровня) над картой сети (js/netmap.js, с 5 уровня). */
.side{display:flex;flex-direction:column;align-items:flex-start;padding-bottom:14px}
.net{margin:0;font-size:22px;line-height:1.25;color:var(--dim);white-space:pre}
.net .lit{color:var(--amber)}
.net .pk{color:#d9ffd0}
.scope{margin:0 0 10px;font-size:22px;line-height:1;color:var(--fg);white-space:pre}
.scope .dim{color:var(--dim)}
.scope .lit{color:var(--amber)}
.log .sys{color:var(--dim);font-size:20px}
.log .ok::before{content:"✓ ";color:var(--amber)}
.foot{display:flex;justify-content:space-between;font-size:24px;color:var(--dim);border-top:1px solid var(--faint);padding-top:6px}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(ellipse at center,#111a13 0%,var(--bg) 70%,#000 100%);font-size:64px;text-align:center;gap:30px}
.overlay.on{display:flex}
.overlay .big{font-size:96px;color:var(--amber);text-shadow:0 0 18px rgba(255,194,74,.7)}
.overlay .small{font-size:44px;color:var(--fg);opacity:.75}
.menu div{font-size:64px;color:var(--dim);padding:6px 40px}
.menu div.sel{color:var(--fg)}
.menu div.sel::before{content:"> ";color:var(--amber)}
#login{font-size:72px}
</style></head><body>
<div class="crt" id="game">
 <div class="bar"><span><b>ПАРОЛИ</b> v0.1 · tty1 <span class="sectors" id="sectors"></span></span><span>УРОВЕНЬ <b id="lvl">1</b> · <span class="access">ДОСТУП <b id="done">0</b>/<b id="total">6</b></span></span></div>
 <div class="entry">
  <div class="input"><span class="p">&gt;</span> <span id="typed"></span><span class="slot"><span class="hint" id="hint"></span><span class="cur" id="cur"></span></span></div>
  <div class="speak" id="speak"><svg class="ico" viewBox="0 0 12 12" shape-rendering="crispEdges" fill="currentColor" aria-hidden="true"><rect x="7" y="0" width="1" height="1"/><rect x="6" y="1" width="2" height="1"/><rect x="5" y="2" width="1" height="1"/><rect x="7" y="2" width="1" height="1"/><rect x="10" y="2" width="1" height="1"/><rect x="4" y="3" width="1" height="1"/><rect x="7" y="3" width="1" height="1"/><rect x="11" y="3" width="1" height="1"/><rect x="0" y="4" width="2" height="1"/><rect x="3" y="4" width="1" height="1"/><rect x="7" y="4" width="1" height="1"/><rect x="11" y="4" width="1" height="1"/><rect x="0" y="5" width="1" height="1"/><rect x="2" y="5" width="2" height="1"/><rect x="7" y="5" width="1" height="1"/><rect x="11" y="5" width="1" height="1"/><rect x="0" y="6" width="1" height="1"/><rect x="2" y="6" width="2" height="1"/><rect x="7" y="6" width="1" height="1"/><rect x="11" y="6" width="1" height="1"/><rect x="0" y="7" width="2" height="1"/><rect x="3" y="7" width="1" height="1"/><rect x="7" y="7" width="1" height="1"/><rect x="11" y="7" width="1" height="1"/><rect x="4" y="8" width="1" height="1"/><rect x="7" y="8" width="1" height="1"/><rect x="11" y="8" width="1" height="1"/><rect x="5" y="9" width="1" height="1"/><rect x="7" y="9" width="1" height="1"/><rect x="10" y="9" width="1" height="1"/><rect x="6" y="10" width="2" height="1"/><rect x="7" y="11" width="1" height="1"/></svg><span class="wave" id="wave">▁▁▁▁▁▁▁▁▁</span> <span id="speakText"></span></div>
 </div>
 <div class="low"><div class="log" id="log"></div><div class="side"><pre class="scope" id="scope"></pre><pre class="net" id="net"></pre></div></div>
 <div class="foot"><span id="sys1">root@tty1</span><span id="clock">00:00:00</span><span style="color:var(--fg);opacity:.6">Esc — пауза</span></div>
</div>
<div class="win" id="win"><div class="winbox"><div class="wintitle">■ ПРОВЕРКА ПАРОЛЯ · <b>ДОСТУП</b></div><pre id="fx"></pre></div></div>
<div class="overlay on" id="login"><div><span style="color:var(--dim)">login:</span> <span class="cur"></span></div><div class="small">нажми любую клавишу</div></div>
<div class="overlay" id="pause"><div class="menu"><div class="sel">продолжить</div><div>уровень заново</div></div></div>
<div class="overlay" id="final"><div class="big">ВСЕ УРОВНИ ОТКРЫТЫ</div><div class="small">доступ полный</div></div>
<script type="module" src="js/main.js"></script>
</body></html>
